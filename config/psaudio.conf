# PS Audio Bridge — /etc/psaudio/psaudio.conf
# Shell syntax (KEY=value). Re-run `psaudio-ctl configure` after changing devices.

# The account that runs the audio stack (PipeWire user session, lingering).
PSAUDIO_USER=psaudio

# Where soundboard clips live (WAV, any rate; 48 kHz mono is ideal).
SOUNDS_DIR=/home/psaudio/sounds

# PipeWire node names. "auto" picks them at runtime:
#   HEADSET_*  the first USB headset/DAC (alsa_*.usb-…)
#   GADGET_*   the Pi's own USB audio gadget that the console sees (alsa_*.platform-….usb…)
# Pin them if auto picks the wrong device — list candidates with `psaudio-ctl devices`.
HEADSET_SINK=auto
HEADSET_SOURCE=auto
GADGET_SINK=auto
GADGET_SOURCE=auto

# What the console sees when the Pi is plugged in.
GADGET_MANUFACTURER="Raspberry Pi"
GADGET_PRODUCT="PS Audio Bridge"
GADGET_SERIAL=psaudio-001

# Soundboard volume when nothing has been set yet (0-100).
DEFAULT_VOLUME=80
