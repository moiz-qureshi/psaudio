# DNS for the PS5 only (set by hand on the console: Settings > Network > DNS = 192.168.5.54).
# The PS5's Twitch broadcast looks up these plain-RTMP ingest names; answering them with
# the MacBook's IP sends the stream to the PS5 Stream app there instead of Twitch.
# Everything else goes to the eero, unchanged.
# Method: https://yashgarg.dev/posts/hijacking-ps5-rtmp-stream/
listen-address=192.168.5.54
bind-interfaces
no-resolv
no-hosts
server=192.168.4.1
server=1.1.1.1
cache-size=1000
filter-AAAA                     # IPv4 only, so nothing reaches the real ingest over IPv6
log-queries
log-facility=-

# MacBook (reserve 192.168.4.38 for it in the eero app)
address=/contribute.live-video.net/192.168.4.38
address=/ingest.global-contribute.live-video.net/192.168.4.38
address=/live.twitch.tv/192.168.4.38
address=/live-sin.twitch.tv/192.168.4.38
address=/live-nrt.twitch.tv/192.168.4.38
address=/live-syd.twitch.tv/192.168.4.38
address=/live-fra.twitch.tv/192.168.4.38
address=/live-ams.twitch.tv/192.168.4.38
address=/live-lhr.twitch.tv/192.168.4.38
address=/live-jfk.twitch.tv/192.168.4.38
address=/live-lax.twitch.tv/192.168.4.38
address=/live-sea.twitch.tv/192.168.4.38
