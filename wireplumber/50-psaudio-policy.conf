# PS Audio Bridge — WirePlumber policy
# Keep ACP enabled (provides -stereo-fallback / -mono-fallback nodes we depend on)
monitor.alsa.properties = {
    alsa.use-acp = true
    alsa.reserve = false
}

monitor.alsa.rules = [
    {
        matches = [
            { alsa.card_name = "~.*" }
        ]
        actions = {
            update-props = {
                resample.quality = 4
                clock.allowed-modes = [ sync adapt ]
            }
        }
    }
]
